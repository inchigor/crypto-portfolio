name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check public/app.js
          node --check public/ui.js
          node --check server/index.js
          node --check server/prices.js
          node --check server/wallet.js
          node --check server/portfolio.js
          node --check server/history.js
          node --check server/storage.js

      - name: Test
        run: npm test
